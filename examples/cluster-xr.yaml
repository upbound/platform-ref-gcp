# A Cluster with every parameter set. Most consumers need only the fields in
# cluster-claim.yaml; the rest have defaults, and the fields marked "override"
# pin a choice the platform would otherwise make and keep up to date.
apiVersion: gcp.platformref.upbound.io/v1alpha1
kind: Cluster
metadata:
  name: platform-ref-gcp
  namespace: default
spec:
  parameters:
    id: platform-ref-gcp
    region: us-west2
    version: latest
    deletionPolicy: Delete
    providerConfigName: default
    nodes:
      count: 1
      size: medium
      # Override: an exact machine type, used instead of size.
      instanceType: n1-standard-4
    # Override: pinned chart versions, used instead of the platform's.
    operators:
      flux:
        version: "2.10.6"
      flux-sync:
        version: "1.7.2"
      prometheus:
        version: "52.1.0"
    gitops:
      git:
        url: https://github.com/upbound/platform-ref-gcp/
        path: /
        interval: 5m0s
        timeout: 60s
        ref:
          name: refs/heads/main
