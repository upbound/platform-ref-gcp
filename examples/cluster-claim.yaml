apiVersion: gcp.platformref.upbound.io/v1alpha1
kind: Cluster
metadata:
  name: platform-ref-gcp
  namespace: default
spec:
  parameters:
    id: platform-ref-gcp-devex
    region: us-west2
    nodes:
      count: 1
      size: medium
    gitops:
      git:
        url: https://github.com/upbound/platform-ref-gcp/
        ref:
          # refs/heads/main
          # refs/tags/v0.1.0
          # refs/pull/420/head
          # refs/merge-requests/1/head
          name: refs/heads/main
