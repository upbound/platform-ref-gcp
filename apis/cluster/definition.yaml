apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: clusters.gcp.platformref.upbound.io
spec:
  scope: Namespaced
  group: gcp.platformref.upbound.io
  names:
    kind: Cluster
    plural: clusters
    categories:
      - platform
      - gcp
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          description: |
            A Cluster is a GKE cluster with its own network, an observability
            stack and a GitOps agent, ready for applications and databases.

            This is the platform API. Fields here describe what consumers want,
            not how it is built; the implementation behind it may change without
            changing this schema. Changes to this schema are additive only.
          properties:
            spec:
              type: object
              properties:
                parameters:
                  type: object
                  description: Cluster configuration parameters.
                  properties:
                    id:
                      type: string
                      description: ID of this Cluster that other objects will use to refer to it.
                    region:
                      type: string
                      description: Region is the region you'd like your resource to be created in.
                    deletionPolicy:
                      description: |
                        What happens to the cloud resources when this Cluster is deleted.
                        Delete removes them. Orphan leaves the network and cluster running
                        in GCP, so they outlive the control plane that created them.
                      enum:
                        - Delete
                        - Orphan
                      type: string
                      default: Delete
                    providerConfigName:
                      description: Crossplane ProviderConfig to use for provisioning this resources
                      type: string
                      default: default
                    version:
                      type: string
                      description: Kubernetes version of the Cluster
                      default: latest
                    nodes:
                      type: object
                      description: Cluster node configuration parameters.
                      properties:
                        count:
                          type: integer
                          description: Desired node count, from 1 to 100.
                        size:
                          type: string
                          description: |
                            Size of each node. The platform maps this to a current machine
                            type, and may change that mapping as GCP offers better ones.
                            Ignored when instanceType is set.
                          enum:
                            - small
                            - medium
                            - large
                          default: medium
                        instanceType:
                          type: string
                          description: |
                            Override: an exact GCP machine type, e.g. n1-standard-4. Takes
                            precedence over size. Prefer size unless you need a specific
                            machine type; a pinned type will not follow platform updates.
                      required:
                        - count
                    operators:
                      description: |
                        Override: pin the chart versions of the cluster's operators. Leave
                        unset to run the versions the platform currently supports; a pinned
                        version will not follow platform updates.
                      type: object
                      properties:
                        flux:
                          description: Configuration for the Flux GitOps operator.
                          type: object
                          properties:
                            version:
                              description: flux helm-chart version to run.
                              type: string
                        flux-sync:
                          description: Configuration for the Flux Sync Helm-Chart.
                          type: object
                          properties:
                            version:
                              description: flux sync helm-chart version to run.
                              type: string
                        prometheus:
                          description: Configuration for the Prometheus Helm-Chart.
                          type: object
                          properties:
                            version:
                              description: prometheus helm-chart version to run.
                              type: string
                    gitops:
                      description: GitOps configure gitops system
                      type: object
                      properties:
                        git:
                          type: object
                          properties:
                            interval:
                              default: "5m0s"
                              description: Interval at which the GitRepository URL is checked for
                                updates. This interval is approximate and may be subject to jitter
                                to ensure efficient use of resources.
                              pattern: ^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$
                              type: string
                            timeout:
                              default: "60s"
                              description: Timeout for Git operations like cloning, defaults to
                                60s.
                              pattern: ^([0-9]+(\.[0-9]+)?(ms|s|m))+$
                              type: string
                            url:
                              description: URL specifies the Git repository URL, it can be an HTTP/S
                                or SSH address.
                              pattern: ^(http|https|ssh)://.*$
                              type: string
                            path:
                              type: string
                              default: "/"
                            ref:
                              description: Reference specifies the Git reference to resolve and
                                monitor for changes.
                              type: object
                              properties:
                                name:
                                  description: "Name of the reference to check out; takes precedence
                                    over Branch, Tag and SemVer. \n It must be a valid Git reference:
                                    https://git-scm.com/docs/git-check-ref-format#_description Examples:
                                    \"refs/heads/main\", \"refs/tags/v0.1.0\", \"refs/pull/420/head\",
                                    \"refs/merge-requests/1/head\""
                                  type: string
                          required:
                            - interval
                            - timeout
                            - url
                            - path
                            - ref
                      required:
                        - git
                  required:
                    - deletionPolicy
                    - gitops
                    - id
                    - nodes
                    - providerConfigName
                    - region
              required:
                - parameters
            status:
              type: object
              description: |
                What this Cluster publishes for the resources that build on it. Read
                these values rather than deriving names from the implementation.
              properties:
                network:
                  type: object
                  properties:
                    id:
                      type: string
                      description: Network ID. Use as networkRef.id on a SQLInstance.
                    ready:
                      type: boolean
                      description: Whether the network is ready.
                kubernetes:
                  type: object
                  properties:
                    ready:
                      type: boolean
                      description: Whether the GKE cluster is ready.
                    providerConfigName:
                      type: string
                      description: ProviderConfig that deploys into this cluster. Use as
                        providerConfigName on an App.
                    kubeconfigSecretRef:
                      type: object
                      description: Secret in this namespace holding the cluster's kubeconfig.
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                observability:
                  type: object
                  properties:
                    ready:
                      type: boolean
                      description: Whether the observability stack is ready.
                gitops:
                  type: object
                  properties:
                    ready:
                      type: boolean
                      description: Whether the GitOps agent is ready.
                subnetIds:
                  type: array
                  description: Deprecated. Never populated; kept so existing readers stay valid.
                  items:
                    type: string
